name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Triggers when pushing a tag like v1.0.0, v1.0.1

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Rename APK Asset
        run: |
          mkdir -p build/outputs/release
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/release/app-release.apk

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/outputs/release/app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка релиза ${{ github.ref_name }} для "АвтоФинансы".
            Файл app-release.apk прикреплён к этому релизу.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
